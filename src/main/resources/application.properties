# Server
server.port=${PORT:8080}

# App
spring.application.name=minicompiler-backend

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimización para Render (Pool de conexiones Hikari)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# AI
app.ai.api-key=${OPENROUTER_API_KEY}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT
app.jwt.secret=${JWT_SECRET:miniCompilerSecretKey2024XyZ9876543210abcdef}
app.jwt.expiration=86400000

# App metadata
app.version=1.0.0

# AI — OpenRouter
app.ai.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
app.ai.model=${AI_MODEL:qwen/qwen-2.5-7b-instruct}
app.ai.http-referer=${AI_HTTP_REFERER:https://minicompiler-backend.onrender.com}
app.ai.title=${AI_TITLE:MiniCompiler Studio}
app.ai.max-tokens=${AI_MAX_TOKENS:2048}
app.ai.temperature=${AI_TEMPERATURE:0.7}